[package]
name = "chaoticclient"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.29"
rfd = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
md5 = "0.7"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
